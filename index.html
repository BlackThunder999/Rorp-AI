<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rorp AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0f; color: #e8e8ec;
    display: flex; flex-direction: column;
  }

  /* Header */
  .chat-header {
    background: rgba(15, 15, 22, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: rgba(255,255,255,0.05); color: #e8e8ec;
    font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
  .chat-title { font-size: 15px; font-weight: 600; flex: 1; }
  .chat-title .model-tag {
    font-size: 11px; font-weight: 400; color: #8b8b9a;
    display: block; margin-top: 2px;
  }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: rgba(255,255,255,0.05); color: #e8e8ec;
    font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }
  .icon-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); }

  /* Model selector */
  .model-bar {
    display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto;
    background: rgba(15, 15, 22, 0.95);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    scrollbar-width: none; flex-shrink: 0;
  }
  .model-bar::-webkit-scrollbar { display: none; }
  .model-chip {
    padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03); color: #b8b8c8; font-size: 13px;
    cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
  }
  .model-chip:hover { background: rgba(255,255,255,0.08); }
  .model-chip.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-color: transparent; color: white; font-weight: 500;
  }
  .model-chip .badge {
    font-size: 10px; opacity: 0.7; margin-left: 4px;
  }

  /* Messages */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .msg {
    max-width: 85%; padding: 12px 16px; border-radius: 18px;
    line-height: 1.5; font-size: 15px; word-wrap: break-word;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border-bottom-right-radius: 6px;
  }
  .msg.ai {
    align-self: flex-start;
    background: rgba(255,255,255,0.06);
    color: #e8e8ec; border-bottom-left-radius: 6px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .msg.ai img, .msg.ai video {
    max-width: 100%; border-radius: 12px; margin-top: 8px; display: block;
  }
  .msg .model-label {
    font-size: 11px; opacity: 0.6; margin-bottom: 6px; display: block;
  }

  .typing {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: #8b8b9a;
    animation: typing 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-4px); }
  }

  /* Input */
  .input-bar {
    padding: 12px 16px 16px;
    background: rgba(15, 15, 22, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .input-wrap {
    display: flex; align-items: flex-end; gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 6px 6px 6px 16px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: #667eea; }
  .input-wrap textarea {
    flex: 1; background: none; border: none; outline: none;
    color: #e8e8ec; font-size: 15px; font-family: inherit;
    resize: none; max-height: 120px; padding: 8px 0;
    line-height: 1.4;
  }
  .input-wrap textarea::placeholder { color: #6b6b7a; }
  .attach-btn, .send-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: all 0.2s;
  }
  .attach-btn {
    background: rgba(255,255,255,0.08); color: #b8b8c8; font-size: 18px;
  }
  .attach-btn:hover { background: rgba(255,255,255,0.15); }
  .send-btn {
    background: linear-gradient(135deg, #667eea, #764ba2); color: white;
    font-size: 16px;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .preview {
    display: none; margin-bottom: 8px; padding: 8px;
    background: rgba(255,255,255,0.05); border-radius: 12px;
    align-items: center; gap: 8px;
  }
  .preview.show { display: flex; }
  .preview img, .preview video {
    width: 48px; height: 48px; object-fit: cover; border-radius: 8px;
  }
  .preview .remove {
    margin-left: auto; background: none; border: none; color: #ff6b6b;
    font-size: 18px; cursor: pointer; padding: 4px 8px;
  }

  /* Welcome */
  .welcome {
    text-align: center; padding: 60px 20px; color: #6b6b7a;
  }
  .welcome .logo {
    font-size: 42px; font-weight: 900; letter-spacing: -1.5px;
    background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 12px;
  }
  .welcome .hint { font-size: 14px; line-height: 1.6; }
  .welcome .hint strong { color: #b8b8c8; }
</style>
</head>
<body>

<div class="chat-header">
  <button class="back-btn" onclick="clearChat()">↺</button>
  <div class="chat-title">
    Rorp AI
    <span class="model-tag" id="currentModelLabel">Rorp Text 1.0 Base</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="toggleModels()" title="Модели">⚙</button>
  </div>
</div>

<div class="model-bar" id="modelBar">
  <button class="model-chip active" data-model="text" data-label="Rorp Text 1.0 Base">
    ✍️ Rorp Text <span class="badge">1.0 Base</span>
  </button>
  <button class="model-chip" data-model="image" data-label="Rorp Image 1.0 Base">
    🖼️ Rorp Image <span class="badge">1.0 Base</span>
  </button>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="logo">Rorp AI</div>
    <div class="hint">
      <strong>Rorp Text 1.0</strong> — задай вопрос, получи ответ.<br>
      <strong>Rorp Image 1.0</strong> — опиши картинку, получи изображение.<br><br>
      Можно прикрепить фото или видео к сообщению.
    </div>
  </div>
</div>

<div class="input-bar">
  <div class="preview" id="preview">
    <img id="previewImg" style="display:none">
    <video id="previewVid" style="display:none"></video>
    <button class="remove" onclick="removeAttachment()">✕</button>
  </div>
  <div class="input-wrap">
    <textarea id="input" placeholder="Напиши сообщение..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
    <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="handleFile(this)">
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const modelBar = document.getElementById('modelBar');
const currentModelLabel = document.getElementById('currentModelLabel');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const previewVid = document.getElementById('previewVid');

let currentModel = 'text';
let currentModelName = 'Rorp Text 1.0 Base';
let attachment = null;
let history = [];

// Model switch
modelBar.querySelectorAll('.model-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    modelBar.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentModel = chip.dataset.model;
    currentModelName = chip.dataset.label;
    currentModelLabel.textContent = currentModelName;
  });
});

// Auto resize textarea
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// Enter to send (Shift+Enter = new line)
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

// File attachment
function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  attachment = { file, url, type: file.type };
  preview.classList.add('show');
  if (file.type.startsWith('image/')) {
    previewImg.src = url; previewImg.style.display = 'block';
    previewVid.style.display = 'none';
  } else if (file.type.startsWith('video/')) {
    previewVid.src = url; previewVid.style.display = 'block';
    previewImg.style.display = 'none';
  }
}

function removeAttachment() {
  attachment = null;
  preview.classList.remove('show');
  previewImg.src = ''; previewVid.src = '';
  document.getElementById('fileInput').value = '';
}

// Clear chat
function clearChat() {
  messagesEl.innerHTML = `
    <div class="welcome">
      <div class="logo">Rorp AI</div>
      <div class="hint">
        <strong>Rorp Text 1.0</strong> — задай вопрос, получи ответ.<br>
        <strong>Rorp Image 1.0</strong> — опиши картинку, получи изображение.<br><br>
        Можно прикрепить фото или видео к сообщению.
      </div>
    </div>`;
  history = [];
  removeAttachment();
}

// Toggle model bar
function toggleModels() {
  const bar = document.getElementById('modelBar');
  bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
}

// Add message to chat
function addMessage(role, content, opts = {}) {
  const welcomeEl = messagesEl.querySelector('.welcome');
  if (welcomeEl) welcomeEl.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (opts.modelLabel) {
    const label = document.createElement('span');
    label.className = 'model-label';
    label.textContent = opts.modelLabel;
    div.appendChild(label);
  }

  if (opts.image) {
    const img = document.createElement('img');
    img.src = opts.image;
    div.appendChild(img);
  } else if (opts.video) {
    const vid = document.createElement('video');
    vid.src = opts.video; vid.controls = true; vid.loop = true;
    div.appendChild(vid);
  } else if (opts.attachment) {
    if (opts.attachment.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = opts.attachment.url;
      div.appendChild(img);
    } else if (opts.attachment.type.startsWith('video/')) {
      const vid = document.createElement('video');
      vid.src = opts.attachment.url; vid.controls = true;
      div.appendChild(vid);
    }
  }

  if (content) {
    const p = document.createElement('div');
    p.textContent = content;
    div.appendChild(p);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// Typing indicator
function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

// Send message
async function send() {
  const text = inputEl.value.trim();
  if (!text && !attachment) return;

  sendBtn.disabled = true;
  inputEl.value = ''; autoResize(inputEl);

  // Add user message
  addMessage('user', text, { attachment });
  history.push({ role: 'user', content: text });

  const att = attachment;
  removeAttachment();

  addTyping();

  try {
    if (currentModel === 'image') {
      // Rorp Image 1.0 — Pollinations image
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;
      // Preload image
      await new Promise((res, rej) => {
        const img = new Image();
        img.onload = res; img.onerror = rej;
        img.src = url;
      });
      removeTyping();
      addMessage('ai', '', { modelLabel: currentModelName, image: url });
    } else {
      // Rorp Text 1.0 — Pollinations text
      const systemPrompt = `Ты — Rorp AI, дружелюбный и умный ассистент. Отвечай на русском языке, кратко и по делу.`;
      const fullPrompt = encodeURIComponent(systemPrompt + '\n\nПользователь: ' + text);
      const response = await fetch(`https://text.pollinations.ai/${fullPrompt}`);
      let reply = await response.text();
      reply = reply.trim();
      removeTyping();
      addMessage('ai', reply, { modelLabel: currentModelName });
    }
  } catch (e) {
    removeTyping();
    addMessage('ai', 'Не удалось получить ответ. Попробуй ещё раз.', { modelLabel: currentModelName });
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

inputEl.focus();
</script>
</body>
</html>
